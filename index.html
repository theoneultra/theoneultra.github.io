<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>theoneultra | 个人站</title>
  <meta name="description" content="个人文章与分享站点" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles/site.css" />
</head>
<body>
  <div class="bg-shape bg-shape-a"></div>
  <div class="bg-shape bg-shape-b"></div>

  <header class="site-header wrap">
    <a class="brand" href="index.html">theoneultra</a>
    <nav>
      <a href="index.html" class="active">首页</a>
      <a href="running.html">动态</a>
      <a href="articles/welcome.html">文章</a>
    </nav>
  </header>

  <main class="wrap">
    <section class="hero reveal">
      <p class="eyebrow">Personal Publishing Space</p>
      <h1>记录思考、分享作品、持续更新</h1>
      <p class="hero-copy">这是一个面向长期写作和内容沉淀的个人网站架构，页面轻量、模块清晰，适合后续持续扩展。</p>
      <div class="hero-actions">
        <a class="btn btn-primary" href="articles/welcome.html">开始阅读</a>
        <a class="btn btn-ghost" href="running.html">查看最近动态</a>
      </div>
    </section>

    <section class="grid reveal delay-1">
      <article class="card">
        <h2>文章模块</h2>
        <p>所有内容放入 <code>articles/</code>，每篇独立 HTML，便于管理与迁移。</p>
        <a href="articles/welcome.html">进入文章页</a>
      </article>
      <article class="card">
        <h2>视觉升级</h2>
        <p>统一设计变量、渐变背景与动效，保持舒适阅读和个性表达。</p>
        <a href="styles/site.css">查看样式文件</a>
      </article>
      <article class="card">
        <h2>后续更新</h2>
        <p>新增页面仅需复制模板、补充导航与内容，不依赖 mkdocs 构建。</p>
        <a href="running.html">查看更新日志</a>
      </article>
    </section>
  </main>

  <footer class="site-footer wrap">
    <p>Copyright © 2026 theoneultra</p>
  </footer>

  <script src="scripts/site.js"></script>
</body>
</html>
